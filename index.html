<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajouter Membres</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

/* 🔹 Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyAbLA-0WqBJ3Zj23rjMuVLX6gjuK-QtAOs",
  authDomain: "liste-de-presence-bloom.firebaseapp.com",
  projectId: "liste-de-presence-bloom",
  storageBucket: "liste-de-presence-bloom.firebasestorage.app",
  messagingSenderId: "536880469723",
  appId: "1:536880469723:web:1ed8a69be38546df61defe",
  measurementId: "G-M9T674XVZY"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const membresRef = collection(db, "membres");

/* 🔹 Listes locales */
let filles = [];
let garcons = [];
let coachs = [];

/* 🔹 Base */
let baseMembres = [];

/* 🔹 Ajouter nom */
function ajouterNom(categorie) {
  const input = document.getElementById(`${categorie}Input`);
  const nom = input.value.trim();
  if(!nom) return alert("Entrez un nom !");
  if(categorie === "filles") filles.push(nom);
  if(categorie === "garcons") garcons.push(nom);
  if(categorie === "coachs") coachs.push(nom);
  input.value = "";
  afficherListeLocal(categorie);
}

/* 🔹 Supprimer un nom local manuellement */
function supprimerLocal(categorie, index) {
  if(categorie === "filles") filles.splice(index,1);
  if(categorie === "garcons") garcons.splice(index,1);
  if(categorie === "coachs") coachs.splice(index,1);
  afficherListeLocal(categorie);
}

/* 🔹 Affichage local AVEC croix */
function afficherListeLocal(categorie) {
  const ul = document.getElementById(`${categorie}Liste`);
  ul.innerHTML = "";
  const liste = categorie==="filles"?filles:categorie==="garcons"?garcons:coachs;

  liste.forEach((nom,i)=>{
    const li = document.createElement("li");
    li.innerHTML = `
      ${i+1}. ${nom}
      <span onclick="supprimerLocal('${categorie}', ${i})">❌</span>
    `;
    ul.appendChild(li);
  });
}

/* 🔹 Envoi en base (LES NOMS RESTENT) */
async function envoyerBase() {
  const allNoms = [
    ...filles.map(n => ({nom:n, categorie:"Fille"})),
    ...garcons.map(n => ({nom:n, categorie:"Garçon"})),
    ...coachs.map(n => ({nom:n, categorie:"Coach"}))
  ];
  if(allNoms.length === 0) return alert("Aucun nom à envoyer !");
  for(const m of allNoms) await addDoc(membresRef, m);
  alert("Noms envoyés en base (ils restent affichés)");
}

/* 🔹 Supprimer en base */
async function supprimerMembre(id) {
  if(!confirm("Supprimer ce membre de la base ?")) return;
  await deleteDoc(doc(db,"membres",id));
}

/* 🔹 Lecture base */
onSnapshot(membresRef, snap=>{
  baseMembres = [];
  snap.forEach(d=>{
    const data = d.data();
    baseMembres.push({id:d.id, nom:data.nom, categorie:data.categorie});
  });
  afficherBaseUnique();
});

/* 🔹 Affichage base */
function afficherBaseUnique() {
  const ul = document.getElementById("baseListeUnique");
  ul.innerHTML = "";
  baseMembres.forEach((m,i)=>{
    const li = document.createElement("li");
    li.innerHTML = `
      ${i+1}. ${m.nom} (${m.categorie})
      <span onclick="supprimerMembre('${m.id}')">❌</span>
    `;
    ul.appendChild(li);
  });
}

/* 🔹 Navigation */
function allerPresence(){
  window.location.href = "presence.html";
}

window.ajouterNom = ajouterNom;
window.envoyerBase = envoyerBase;
window.supprimerLocal = supprimerLocal;
window.supprimerMembre = supprimerMembre;
window.allerPresence = allerPresence;
</script>

<style>
body{
  font-family:'Segoe UI',Arial;
  background:#121212;
  color:#eee;
  padding:20px;
  min-height:100vh;
  position:relative;
}
body::before{
  content:"BLOOM";
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%) rotate(-15deg);
  font-size:200px;
  color:rgba(255,255,255,.05);
  letter-spacing:20px;
  pointer-events:none;
}
section{
  background:#1e1e1e;
  padding:15px;
  border-radius:15px;
  margin-bottom:20px;
}
input{
  width:70%;
  padding:10px;
  border-radius:8px;
  border:none;
  background:#2b2b2b;
  color:#fff;
}
button{
  padding:10px 20px;
  margin:5px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  background:linear-gradient(135deg,#6a0dad,#d147a3);
  color:#fff;
}
ul{padding-left:20px}
li span{margin-left:10px;color:#ff6b6b;cursor:pointer}
</style>
</head>

<body>

<h1>Ajouter des Membres</h1>

<section>
<h2>Filles</h2>
<input id="fillesInput" placeholder="Nom">
<button onclick="ajouterNom('filles')">Ajouter</button>
<ul id="fillesListe"></ul>
</section>

<section>
<h2>Garçons</h2>
<input id="garconsInput" placeholder="Nom">
<button onclick="ajouterNom('garcons')">Ajouter</button>
<ul id="garconsListe"></ul>
</section>

<section>
<h2>Coachs</h2>
<input id="coachsInput" placeholder="Nom">
<button onclick="ajouterNom('coachs')">Ajouter</button>
<ul id="coachsListe"></ul>
</section>

<section>
<h2>Tous les membres en base</h2>
<ul id="baseListeUnique"></ul>
</section>

<div style="text-align:center">
<button onclick="envoyerBase()">Envoyer tous les noms en base</button>
<button onclick="allerPresence()">Voir la liste de présence</button>
</div>

</body>
</html>
